<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleeknote Login</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* RESET & GLOBAL STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'DM Sans', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            background-color: #ffffff;
            overflow: hidden; /* Mencegah scroll */
        }

        /* --- LEFT SIDE (LOGIN FORM) --- */
        .left-section {
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: #fff;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Logo Area */
        .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            color: #4F46E5; /* Warna Biru Utama */
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.5px;
        }

        .logo-icon {
            background-color: #4F46E5;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 16px;
        }

        h1 {
            font-size: 32px;
            color: #111827;
            margin-bottom: 30px;
            font-weight: 700;
        }

        /* Google Button */
        .btn-google {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background: white;
            border: 1px solid #E5E7EB;
            border-radius: 6px;
            color: #374151;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 20px;
        }

        .btn-google:hover {
            background-color: #F9FAFB;
        }

        .btn-google img {
            width: 18px;
            margin-right: 10px;
        }

        /* Divider "OR" */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #9CA3AF;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #E5E7EB;
        }

        .divider::before { margin-right: 15px; }
        .divider::after { margin-left: 15px; }

        /* Form Inputs */
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #1F2937;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #E5E7EB;
            border-radius: 6px;
            font-size: 14px;
            color: #374151;
            transition: border-color 0.2s;
            background-color: #FAFAFA;
        }

        .form-control::placeholder {
            color: #D1D5DB;
        }

        .form-control:focus {
            outline: none;
            border-color: #4F46E5;
            background-color: white;
        }

        /* Utility Links (Remember me / Forgot password) */
        .form-utilities {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            color: #1F2937;
            font-weight: 500;
        }

        .checkbox-group input {
            margin-right: 8px;
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #4F46E5;
        }

        .forgot-link {
            color: #EC4899; /* Warna Pink kemerahan sesuai gambar */
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-link:hover { text-decoration: underline; }

        /* Login Button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #4F46E5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #4338CA;
        }

        /* Footer Link */
        .footer-text {
            margin-top: 30px;
            font-size: 14px;
            color: #6B7280;
        }

        .footer-text a {
            color: #EC4899;
            text-decoration: none;
            font-weight: 500;
        }

        /* --- RIGHT SIDE (INFO/ILLUSTRATION) --- */
        .right-section {
            width: 50%;
            height: 100%;
            background-color: #EEF2FF; /* Warna background biru muda */
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 40px;
        }

        .right-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: auto; /* Push content down */
        }

        .academy-branding {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
        }

        .academy-logo {
            font-weight: 700;
            color: #374151;
            display: flex;
            align-items: center;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .academy-logo i {
            margin-right: 8px;
        }

        .academy-desc {
            font-size: 14px;
            color: #6B7280;
            max-width: 300px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .btn-academy {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid #D1D5DB;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            color: #374151;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-academy:hover {
            border-color: #374151;
            background: rgba(0,0,0,0.02);
        }

        /* Illustration Container */
        .illustration-container {
            flex: 1;
            display: flex;
            align-items: flex-end; /* Align image to bottom */
            justify-content: center;
            margin-bottom: 20px;
        }

        .illustration-container img {
            max-width: 80%;
            height: auto;
            /* Drop shadow untuk memberikan kedalaman jika gambar flat */
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.05));
        }

        /* RESPONSIVE DESIGN (Optional) */
        @media (max-width: 900px) {
            .right-section {
                display: none; /* Hide right side on mobile */
            }
            .left-section {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="left-section">
        <div class="login-container">
            <div class="brand-logo">
                <div class="logo-icon"><i class="fas fa-code"></i></div>
                Sleeknote
            </div>

            <h1>Welcome Back</h1>

            <button class="btn-google" onclick="alert('Login with Google clicked')">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google Logo">
                Log in with Google
            </button>

            <div class="divider">OR LOGIN WITH EMAIL</div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-control" placeholder="Email Address" required>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" placeholder="Password" required>
                </div>

                <div class="form-utilities">
                    <label class="checkbox-group">
                        <input type="checkbox" checked> Keep me logged in
                    </label>
                    <a href="#" class="forgot-link">Forgot your password?</a>
                </div>

                <button type="submit" class="btn-submit">Log In</button>
            </form>

            <div class="footer-text">
                Don't have an account? <a href="#">Sign up</a>
            </div>
        </div>
    </div>

    <div class="right-section">
        <div class="right-header">
            <div class="academy-branding">
                <div class="academy-logo">
                    <i class="far fa-file-alt"></i> Sleeknote Academy
                </div>
                <p class="academy-desc">We've got tips and tools to keep your business growing while you're out of the office.</p>
                <button class="btn-academy">Start Academy</button>
            </div>
        </div>

        <div class="illustration-container">
            <img src="https://cdni.iconscout.com/illustration/premium/thumb/man-working-on-laptop-illustration-download-in-svg-png-gif-file-formats--young-boy-logo-freelancer-work-from-home-pack-people-illustrations-4357226.png" alt="Working Illustration">
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault(); // Mencegah reload halaman
            
            // Mengambil nilai input (contoh sederhana)
            const email = e.target.querySelector('input[type="email"]').value;
            const password = e.target.querySelector('input[type="password"]').value;

            // Animasi tombol saat diklik (Visual feedback)
            const btn = e.target.querySelector('.btn-submit');
            const originalText = btn.innerText;
            
            btn.innerText = "Logging in...";
            btn.style.opacity = "0.7";

            // Simulasi loading 1 detik
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.opacity = "1";
                alert(`Login Attempt:\nEmail: ${email}\n(Ini hanya demo frontend, tidak ada backend)`);
            }, 1000);
        }
    </script>
</body>
</html>
